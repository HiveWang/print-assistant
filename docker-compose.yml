services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PRINT_ASSISTANT_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_started
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ui:
    build:
      context: .
      target: ui
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      CUPS_SERVER: "${CUPS_SERVER:-host.docker.internal:631}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-8}"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-100}"
      MAX_FILES: "${MAX_FILES:-50}"
      PRINT_WORKERS: "${PRINT_WORKERS:-2}"
      HISTORY_LIMIT: "${HISTORY_LIMIT:-100}"
      DEFAULT_PRINTER: "${DEFAULT_PRINTER:-}"
      PRINTER_LOCATIONS_JSON: "${PRINTER_LOCATIONS_JSON:-{}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp/print-assistant-ephemeral:size=2g,mode=0700
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
